# Dependabot dependency updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# Updates are consolidated into one monthly pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # These crates require deliberate code migrations and are excluded from automation:
    #   secrecy 0.10+ removed the `alloc` feature; getrandom 0.3+ removed the `js` feature (WASM).
    ignore:
      - dependency-name: "secrecy"
      - dependency-name: "getrandom"
    groups:
      cargo-root:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/pkg-nodejs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      npm-pkg-nodejs:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/pkg"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      npm-pkg:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions-root:
        patterns:
          - "*"
