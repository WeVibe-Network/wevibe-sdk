# Dependabot configuration.
#
# Cargo (crypto) dependencies are intentionally NOT auto-updated here: routine
# major bumps of crypto crates require deliberate code migration. Dependabot
# *security* updates still apply automatically and are unaffected by this file.
#
# The pkg/ and pkg-nodejs/ directories are generated by wasm-pack and are not
# dependency-managed here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions-root:
        patterns:
          - "*"
