[workspace]
members = ["crates/wevibe-sdk-core", "crates/wevibe-sdk-wasm"]
resolver = "2"

[workspace.dependencies]
bip39           = { version = "2.2", default-features = false }
ed25519-dalek   = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek    = { version = "2", features = ["getrandom", "zeroize", "static_secrets"] }
aes-gcm         = "0.10"
hkdf            = "0.12"
sha2            = "0.10"
hmac            = "0.12"
secrecy         = { version = "0.8", features = ["alloc"] }
zeroize         = { version = "1", features = ["derive"] }
rand            = "0.8"
rand_core       = "0.10"
hex             = "0.4"
thiserror       = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
k256             = "0.13"