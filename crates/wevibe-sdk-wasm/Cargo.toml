[package]
name    = "wevibe-sdk-wasm"
version = "0.1.0"
edition = "2021"
license     = "Apache-2.0"
description = "WASM bindings for WeVibe Network crypto primitives"
repository  = "https://github.com/WeVibe-Network/wevibe-sdk"
homepage    = "https://github.com/WeVibe-Network/wevibe-sdk"
readme      = "../../README.md"
keywords    = ["wasm", "cryptography", "wevibe-network"]
categories  = ["wasm", "cryptography"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wevibe-sdk-core = { path = "../wevibe-sdk-core" }
wasm-bindgen  = "0.2"
js-sys        = "0.3"
getrandom     = { version = "0.2", features = ["js"] }
serde_json    = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
