[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wevibe-sdk"
version = "0.1.0"
description = "Client-side SDK for WeVibe Network — crypto, types, keyword utilities"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["wevibe_sdk"]
